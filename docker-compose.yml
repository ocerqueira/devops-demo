# Arquivo que o PORTAINER usa. So referencia imagens prontas -> ele BAIXA do GHCR,
# nunca compila. O build local fica no docker-compose.override.yml.
#
# IMAGE_PREFIX define de onde vem a imagem:
#   - Portainer: defina IMAGE_PREFIX = ghcr.io/SEU_USUARIO/devops-demo (variavel da stack).
#
# O frontend entra na rede externa proxy_net para o Nginx Proxy Manager (NPM)
# enxerga-lo. backend e db ficam so na rede interna da stack.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-devops-demo}-backend:latest
    environment:
      APP_VERSION: "1.0.0"
      DATABASE_URL: "postgresql://demo:demo@db:5432/demo"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${IMAGE_PREFIX:-devops-demo}-frontend:latest
    # Mantemos a porta publicada para testar direto via IP enquanto configura o NPM.
    # Quando o dominio no NPM estiver funcionando, pode remover este bloco "ports".
    ports:
      - "8080:80"
    networks:
      default: {}
      proxy_net:
        aliases:
          - devops-demo-frontend # <- use este nome no NPM (Forward Hostname)
    depends_on:
      - backend
    restart: unless-stopped

networks:
  proxy_net:
    external: true
    name: proxy_net # precisa bater com o nome real em `docker network ls`

volumes:
  db_data:
