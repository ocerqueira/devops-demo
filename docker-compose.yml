# Arquivo que o PORTAINER usa. So referencia imagens prontas -> ele BAIXA do GHCR,
# nunca compila. O build local fica no docker-compose.override.yml.
#
# IMAGE_PREFIX define de onde vem a imagem:
#   - Local (sem a variavel): cai no default "devops-demo" e usa o build do override.
#   - Portainer: defina IMAGE_PREFIX = ghcr.io/SEU_USUARIO/devops-demo (variavel da stack)
#                para puxar as imagens publicadas pelo GitHub Actions.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-devops-demo}-backend:latest
    environment:
      # Mude esta versao + push = jeito mais facil de ver o deploy automatico funcionando
      APP_VERSION: "1.0.0"
      DATABASE_URL: "postgresql://demo:demo@db:5432/demo"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${IMAGE_PREFIX:-devops-demo}-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
